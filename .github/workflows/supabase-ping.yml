name: Supabase ping

# Free-tier Supabase projects pause after ~7 days with no activity. One query
# resets that timer. Daily would do; this runs more often so a skipped run costs
# nothing. No `environment:` on purpose -- that would drag in deployment wait
# timers and delay the ping.

on:
  schedule:
    - cron: '17 6 * * *' # daily; the pause window is ~7 days, so daily has 6 days of slack
    - cron: '*/5 * * * *' # TEMPORARY: proving the scheduler fires here at all. REMOVE once seen.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one dead project must not hide the other's result
      matrix:
        include:
          - target: stg
            required: true
          - target: prd
            required: false # prd has no data; ping it only if a secret is provided
    steps:
      - name: Ping ${{ matrix.target }}
        env:
          CONN: ${{ matrix.target == 'stg' && secrets.SUPABASE_STG_URL || secrets.SUPABASE_PRD_URL }}
        run: |
          if [ -z "$CONN" ]; then
            if [ "${{ matrix.required }}" = "true" ]; then
              echo "::error::secret for ${{ matrix.target }} is not set"
              exit 1
            fi
            echo "no secret for ${{ matrix.target }}, skipping (set SUPABASE_PRD_URL to enable)"
            exit 0
          fi
          psql "$CONN" -w -tAc 'select current_database(), now()'
